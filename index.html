
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto - Taller Web</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <h2>Formulario de Contacto</h2>
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required minlength="3">
                <span class="error-message" id="error-nombre"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="error-email"></span>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                <span class="error-message" id="error-mensaje"></span>
            </div>

            <button type="submit" id="btnEnviar">Enviar Datos</button>
        </form>

        <div id="status-container">
            <p id="status-text"></p>
        </div>
    </div>
    <script src="js/ejemplo-1.js"></script>
</body>
</html>
